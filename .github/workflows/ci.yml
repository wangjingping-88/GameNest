name: GameNest CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: true

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Setup .NET
        uses: actions/setup-dotnet@v5.4.0
        with:
          dotnet-version: 10.0.302

      - name: Restore locked dependencies
        run: dotnet restore GameNest.sln --locked-mode

      - name: Build Release
        run: dotnet build GameNest.sln -c Release --no-restore

      - name: Run all tests
        shell: pwsh
        run: .\scripts\Test-Release.ps1 -DotNetPath (Get-Command dotnet).Source -NoBuild
