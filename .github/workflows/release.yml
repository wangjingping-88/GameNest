name: GameNest Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: true
      GAMENEST_UPDATE_PRIVATE_KEY: ${{ secrets.GAMENEST_UPDATE_PRIVATE_KEY }}
      GAMENEST_UPDATE_PUBLIC_KEY: ${{ vars.GAMENEST_UPDATE_PUBLIC_KEY }}
      GAMENEST_UPDATE_KEY_ID: ${{ vars.GAMENEST_UPDATE_KEY_ID }}

    steps:
      - name: Checkout tag
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - name: Setup pinned .NET SDK
        uses: actions/setup-dotnet@v5.4.0
        with:
          dotnet-version: 10.0.302

      - name: Validate tag, version and signing configuration
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_NAME -notmatch '^v(\d+\.\d+\.\d+)$') {
            throw "Release tag must be vMAJOR.MINOR.PATCH: $env:GITHUB_REF_NAME"
          }
          $version = $Matches[1]
          [xml]$props = Get-Content -LiteralPath .\Directory.Build.props -Raw -Encoding UTF8
          $projectVersion = $props.SelectSingleNode('/Project/PropertyGroup/Version').InnerText.Trim()
          if ($projectVersion -cne $version) {
            throw "Tag version $version does not match Directory.Build.props $projectVersion"
          }
          if ([string]::IsNullOrWhiteSpace($env:GAMENEST_UPDATE_PRIVATE_KEY) -or
              [string]::IsNullOrWhiteSpace($env:GAMENEST_UPDATE_PUBLIC_KEY) -or
              [string]::IsNullOrWhiteSpace($env:GAMENEST_UPDATE_KEY_ID)) {
            throw 'Update signing secret or trusted public-key variables are missing; refusing to publish untrusted assets.'
          }
          "RELEASE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Restore locked dependencies
        run: dotnet restore GameNest.sln --locked-mode

      - name: Build Release
        run: dotnet build GameNest.sln -c Release --no-restore

      - name: Run complete test suite
        shell: pwsh
        run: .\scripts\Test-Release.ps1 -DotNetPath (Get-Command dotnet).Source -NoBuild

      - name: Download and verify PresentMon 2.5.1
        shell: pwsh
        run: |
          $presentMon = Join-Path $env:RUNNER_TEMP 'PresentMon-2.5.1-x64.exe'
          Invoke-WebRequest `
            -Uri 'https://github.com/GameTechDev/PresentMon/releases/download/v2.5.1/PresentMon-2.5.1-x64.exe' `
            -OutFile $presentMon
          $expected = '9BEC3083069F58F911E6A512F4806DB51A27BD096103087BC1D05EF54C80A191'
          $actual = (Get-FileHash -LiteralPath $presentMon -Algorithm SHA256).Hash
          if ($actual -cne $expected) {
            throw "PresentMon 2.5.1 SHA-256 mismatch: $actual"
          }
          "PRESENTMON_PATH=$presentMon" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build portable package
        shell: pwsh
        run: |
          .\scripts\Publish-Portable.ps1 `
            -DotNetPath (Get-Command dotnet).Source `
            -PresentMonPath $env:PRESENTMON_PATH `
            -Version $env:RELEASE_VERSION

      - name: Sign update manifest and audit release assets
        shell: pwsh
        run: |
          $baseName = "GameNest-$env:RELEASE_VERSION-win-x64-portable"
          $zip = Join-Path '.\artifacts\release' "$baseName.zip"
          .\scripts\New-UpdateManifest.ps1 `
            -PackageFile $zip `
            -Version $env:RELEASE_VERSION `
            -KeyId $env:GAMENEST_UPDATE_KEY_ID `
            -PublishedAtUtc ([DateTimeOffset]::UtcNow)
          .\scripts\Audit-ReleaseAssets.ps1 `
            -ArtifactDirectory '.\artifacts\release' `
            -Version $env:RELEASE_VERSION `
            -PublicKeyBase64 $env:GAMENEST_UPDATE_PUBLIC_KEY

      - name: Publish trusted GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $baseName = "GameNest-$env:RELEASE_VERSION-win-x64-portable"
          gh release create $env:GITHUB_REF_NAME `
            ".\artifacts\release\$baseName.zip" `
            ".\artifacts\release\$baseName.sha256" `
            ".\artifacts\release\$baseName.update.json" `
            ".\artifacts\release\$baseName.update.sig" `
            --verify-tag `
            --title "GameNest $env:RELEASE_VERSION" `
            --generate-notes
